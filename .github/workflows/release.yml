name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Workspace packages (shared-types, core-ai, …) built BEFORE the app: package:win links
      # against their dist output, and a stale one is a wrong build that still succeeds.
      - run: pnpm -r --filter=!@fixora/desktop build

      # package:win, not build: `build` only compiles to out/ — the .exe under release/ needs the
      # full electron-builder pass. --publish is deliberately omitted here so this step cannot also
      # create a release; the upload step below is the one place that happens.
      - run: pnpm --filter @fixora/desktop package:win
        env:
          ELECTRON_BUILDER_SKIP_PUBLISH: 'true'

      - uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Checkout was on the TAG (detached HEAD) — commit against main's actual tip, not that
      # commit, so this can never diverge from what main already is.
      - name: Point the website's Download links at this tag
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          version="${GITHUB_REF_NAME#v}"
          sed -i -E "s#v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?/Fixora-Setup-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?\.exe#${GITHUB_REF_NAME}/Fixora-Setup-${version}.exe#g" website/index.html
          if ! git diff --quiet -- website/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add website/index.html
            git commit -m "chore(website): point Download links at ${GITHUB_REF_NAME}"
            git push origin main
          fi
