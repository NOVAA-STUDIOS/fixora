name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set apps/desktop/package.json version to the tag
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('apps/desktop/package.json'));p.version=process.env.TAG.replace('v','');fs.writeFileSync('apps/desktop/package.json',JSON.stringify(p,null,2))"

      # Workspace packages (shared-types, core-ai, …) built BEFORE the app: package:win links
      # against their dist output, and a stale one is a wrong build that still succeeds.
      - run: pnpm -r --filter=!@fixora/desktop build

      # package:win, not build: `build` only compiles to out/ — the .exe under release/ needs the
      # full electron-builder pass. --publish is deliberately omitted here so this step cannot also
      # create a release; the upload step below is the one place that happens.
      - run: pnpm --filter @fixora/desktop package:win
        env:
          ELECTRON_BUILDER_SKIP_PUBLISH: 'true'

      - run: dir apps\desktop\release

      - name: Generate release notes from git log
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="${{ github.ref_name }}"
          else
            RANGE="$PREV_TAG..${{ github.ref_name }}"
          fi
          git log "$RANGE" --pretty=format:'%s' \
            | grep -viE '^(chore|merge)' \
            | sed 's/^/- /' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "- No notable changes." > RELEASE_NOTES.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
          body_path: RELEASE_NOTES.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
