<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The real CSP is delivered as a response header by the main process
      (electron/main/security/navigation-guard.ts). This meta tag is the second lock: it
      applies even to a document loaded outside our session, and it is what Electronegativity
      reads. The two are asserted to agree by csp.test.ts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com https://lh3.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://avnvwgymlmzrbppmvvgl.supabase.co wss://avnvwgymlmzrbppmvvgl.supabase.co; worker-src 'self' blob:; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>Fixora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
