# Packaging config (Beta). Unsigned for the beta — code signing (ADR-021, Azure Trusted Signing) lands
# for the paid launch. Produces an NSIS installer for Windows.
#
# The critical detail is asarUnpack: the analysis/verification worker is ESM and loads tree-sitter WASM
# via import.meta.url, which only resolves against real files on disk — never from inside app.asar. So the
# worker and its WASM-bearing deps are unpacked to app.asar.unpacked/ (electron-vite bundles everything
# else into the CJS main). This is the same constraint M2/M3 hit; packaging is where it is finally paid.
appId: dev.fixora.app
productName: Fixora
copyright: © 2026 Fixora

directories:
  output: release
  buildResources: build

# electron-vite has already built main/preload/renderer into out/. We ship that, plus the manifest.
# The other @fixora/* workspace packages are bundled into the CJS main by electron-vite, so their
# node_modules entries are excluded here (only core-analysis is a real runtime package, for the worker).
files:
  - out/**/*
  - package.json
  # Explicit include, not left to electron-builder's automatic production-dependency walker: that
  # walker follows pnpm's node_modules symlink to the real store path (node_modules/.pnpm/node-pty@*/
  # node_modules/node-pty), which sits outside apps/desktop — the exact "refuses the realpath for
  # being outside apps/desktop" bug the //dependencies comment above documents for the @fixora/*
  # packages. A "Cannot find module 'node-pty'" in the packaged app, with node-pty present and
  # working in dev, is that walker silently dropping it. A glob include does not depend on realpath
  # resolution the way the dependency walker does, so it is unaffected by the same bug.
  - node_modules/node-pty/**
  - '!node_modules/@fixora/core-ai/**'
  - '!node_modules/@fixora/shared-types/**'
  - '!node_modules/@fixora/tokens/**'
  - '!node_modules/@fixora/ui/**'
  - '!node_modules/**/{.turbo,__tests__,test,tests}/**'
  - '!node_modules/**/*.{map,ts,tsbuildinfo}'

# Everything the ESM worker needs at runtime, kept as real files outside the asar. The core-analysis
# glob is recursive, so it also unpacks its nested node_modules/{tree-sitter-wasms,web-tree-sitter} —
# where the grammar + core `.wasm` files actually live under pnpm's isolated linker.
asarUnpack:
  - out/main/analysis-worker.mjs
  # Recursive, so this also covers vendor/ruff/ruff.exe — a native executable cannot be spawned from
  # inside an asar, the same constraint that governs the tree-sitter WASM below it.
  - node_modules/@fixora/core-analysis/**
  # node-pty's native binding (pty.node) plus its conpty helper binaries on Windows — same
  # asar-cannot-hold-a-loadable-native-module constraint as the two entries above.
  - node_modules/node-pty/**

# The window icon, read at runtime by `main-window.ts`.
#
# It cannot travel in `files`: `directories.buildResources` is build/, and electron-builder excludes
# that directory from the app package by construction — a `- build/icon.png` entry there is silently
# inert (verified: it did not appear in app.asar). `extraResources` puts it beside the asar instead,
# where `process.resourcesPath` finds it.
#
# On Windows the window inherits the exe's own icon resource, so this is belt and braces; on Linux
# there is no such resource and it is the only icon a window manager gets.
extraResources:
  - from: build/icon.png
    to: icon.png

# GitHub Releases. `releaseType: release` — a `--publish always` run goes stright to a published
# release the moment it uploads, with no draft review step. The build is still UNSIGNED (see
# `signAndEditExecutable` below), so this is what puts a SmartScreen-warned, unverifiable installer
# in front of real users automatically; there is no manual gate left before that happens (ADR-021
# deferred signing, not this decision).
#
# Requires GH_TOKEN in the environment at publish time; it is never stored in this file. See
# docs/RELEASING.md.
publish:
  provider: github
  owner: NOVAA-STUDIOS
  repo: fixora
  releaseType: release
  publishAutoUpdate: true

nodeGypRebuild: false
npmRebuild: false

win:
  target:
    - nsis
  artifactName: Fixora-Setup.exe
  # KNOWN LIMITATION — this flag controls two things, and we only want to skip one of them.
  #
  # It gates code signing (which we genuinely do not do yet: ADR-021 defers it to the paid launch)
  # AND rcedit's rewrite of the exe's icon + version resources (which we DO want). With it off, the
  # shipped Fixora.exe reports itself as "Electron 43.1.0 — GitHub, Inc." in Task Manager and in its
  # Properties dialog, and carries the default Electron icon. The NSIS installer and the Start Menu
  # entry are branded correctly; this affects the inner executable only.
  #
  # It cannot simply be turned on here: electron-builder first extracts the winCodeSign toolchain,
  # whose archive contains macOS symlinks (darwin/**/lib*.dylib). Creating a symlink on Windows needs
  # SeCreateSymbolicLinkPrivilege, so the extraction fails with "A required privilege is not held by
  # the client" and takes the whole build with it. Pre-seeding the cache does not help — the archive
  # is extracted to a freshly randomised directory on every run.
  #
  # To fix: enable Windows Developer Mode (Settings → System → For developers), or run the packaging
  # command from an elevated shell, then set this to true. Verify with:
  #   (Get-Item 'release\win-unpacked\Fixora.exe').VersionInfo
  # which must report ProductName "Fixora" and ProductVersion matching package.json.
  signAndEditExecutable: false

# Writes the icon into Fixora.exe, which `signAndEditExecutable: false` above otherwise skips —
# leaving the exe, and therefore every shortcut pointing at it, showing Electron's default icon.
# Runs before NSIS packs the installer, so the installed copy carries it too. See the script header.
afterPack: scripts/stamp-exe.cjs

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Fixora-Setup.exe
  createDesktopShortcut: always
  shortcutName: Fixora
